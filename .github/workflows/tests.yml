name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  BLENDER_MCP_SAFE_MODE: '1'
  DISABLE_TELEMETRY: 'true'

jobs:
  pytest:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --frozen --python ${{ matrix.python }} --group dev
      - name: Run tests without Blender or production assets
        run: uv run --frozen --python ${{ matrix.python }} pytest -q
      - name: Verify MCP initialization without Blender
        run: uv run --frozen --python ${{ matrix.python }} python scripts/verify_install.py
