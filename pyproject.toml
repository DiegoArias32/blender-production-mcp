[project]
name = "blender-production-mcp"
version = "0.9.0"
description = "Safe character, animation and game-mesh preparation with checkpoints and measured QA derived from mcp-for-blender"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
maintainers = [{name = "DiegoArias32"}]
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-for-blender = "blender_mcp.server:main"
blender-production = "blender_mcp.production.server:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py"]

[project.urls]
"Homepage" = "https://github.com/DiegoArias32/blender-production-mcp"
"Bug Tracker" = "https://github.com/DiegoArias32/blender-production-mcp/issues"
"Documentation" = "https://github.com/DiegoArias32/blender-production-mcp/blob/main/docs/installation.md"
"Upstream" = "https://github.com/ahujasid/mcp-for-blender"
